[project]
name = "orderflow-lite"
version = "1.0.0"
description = "A compact order and inventory API built on PostgreSQL."
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.3",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orderflow"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
show_error_codes = true
pretty = true
files = ["src", "tests"]
