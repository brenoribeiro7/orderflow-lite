name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: orderflow_test
          POSTGRES_USER: orderflow_ci
          POSTGRES_PASSWORD: orderflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow_ci -d orderflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://orderflow_ci:orderflow_ci@127.0.0.1:5432/orderflow_test
      TEST_DATABASE_URL: postgresql+psycopg://orderflow_ci:orderflow_ci@127.0.0.1:5432/orderflow_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.4"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.6

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src tests
